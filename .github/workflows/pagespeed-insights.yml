name: PageSpeed Insights

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagespeed-mobile:
    name: PageSpeed Insights · Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run PageSpeed Insights
        uses: jakepartusch/psi-action@v1.3
        with:
          url: "https://www.mudanzasmiranda.com.ar/"
          strategy: mobile
          threshold: 70
          key: ${{ secrets.PSI_API_KEY }}

  pagespeed-desktop:
    name: PageSpeed Insights · Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run PageSpeed Insights
        uses: jakepartusch/psi-action@v1.3
        with:
          url: "https://www.mudanzasmiranda.com.ar/"
          strategy: desktop
          threshold: 70
          key: ${{ secrets.PSI_API_KEY }}
