name: Extract page components

on:
  push:
    branches: ["refactor/app-pages-extraction"]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[page-extraction-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate page components
        run: python3 scripts/extract-page-components.py
      - name: Commit generated components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract page components [page-extraction-bot]"
          git push
