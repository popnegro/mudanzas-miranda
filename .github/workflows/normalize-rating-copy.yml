name: Normalize verified rating copy

on:
  push:
    branches: ["seo/authority-phase-2"]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'chore(seo): normalize verified rating copy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize verified 4.9 / 496 copy
        run: |
          sed -i 's/4\.9\/5, 186 reviews/4.9\/5, 496 reviews/g' SEO-MIRANDA-AUDIT.md
          sed -i 's/4\.9\/5 (186 reviews)/4.9\/5 (496 reviews)/g' SEO-MIRANDA-AUDIT.md
          sed -i 's/186 opiniones de clientes en Google/496 opiniones de clientes en Google/g' static/src/App.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SEO-MIRANDA-AUDIT.md static/src/App.tsx
          if git diff --cached --quiet; then
            echo 'No rating copy changes required.'
          else
            git commit -m 'chore(seo): normalize verified rating copy'
            git push
          fi
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/normalize-rating-copy.yml
          git commit -m 'chore(ci): remove one-shot rating workflow'
          git push
