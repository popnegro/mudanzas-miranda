name: SEO technical validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit canonical SEO/GEO entry points
        run: npm run audit:static-seo

      - name: Validate sitemap structure
        run: |
          test -f sitemap.xml
          sitemap_urls="$(grep -c '<loc>' sitemap.xml)"
          test "$sitemap_urls" -eq "27"
          ! grep -q '/test.html' sitemap.xml
