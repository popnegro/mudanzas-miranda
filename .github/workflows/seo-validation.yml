name: SEO Technical Validation

on:
  push:
    branches: [main, chore/hardening-refactor-app]
  pull_request:
    branches: [main]

jobs:
  seo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit canonical SEO/GEO entry points
        run: npm run audit:static-seo

      - name: Validate sitemap structure
        run: |
          test -f public/sitemap.xml
          sitemap_urls="$(grep -c '<loc>' public/sitemap.xml)"
          test "$sitemap_urls" -eq "27"
          ! grep -q '/test.html' public/sitemap.xml
          test -f dist/sitemap.xml
          dist_sitemap_urls="$(grep -c '<loc>' dist/sitemap.xml)"
          test "$dist_sitemap_urls" -eq "27"
          ! grep -q '/test.html' dist/sitemap.xml
